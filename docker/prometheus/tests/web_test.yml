# promtool unit tests of rules/web.yml (issue #397). Run in CI:
#   promtool test rules /etc/prometheus/tests/web_test.yml
# Series values are invented (seconds of lag), sampled every minute.

rule_files:
  - ../rules/web.yml

evaluation_interval: 1m

tests:
  # Short stalls (a deploy, one slow request) do not fire; a lag that stays
  # above 1 s fires 5 minutes after it started.
  - interval: 1m
    input_series:
      - series: 'viator_web_event_loop_lag_seconds{job="viator-web"}'
        values: '0.01 0.01 2 0.01 0.01 0.01 2.5x10 0.01x5'
    alert_rule_test:
      - eval_time: 2m
        alertname: WebEventLoopLagHigh
        exp_alerts: []
      - eval_time: 10m
        alertname: WebEventLoopLagHigh
        exp_alerts: []
      - eval_time: 12m
        alertname: WebEventLoopLagHigh
        exp_alerts:
          - exp_labels:
              severity: warning
              job: viator-web
            exp_annotations:
              summary: "web's event loop has been running more than 1 s late for 5 minutes"
              description: "web's event loop ran 2.5s late within the last minute, and has been more than 1 s late for 5 minutes. Every async request and the health check wait that long; past 10 s the HEALTHCHECK fails and autoheal restarts web. Look for blocking work in an async handler: the web log at the time, the \"HTTP latency p95 (per route)\" panel of \"VIATOR — Overview\", and the \"Web event-loop lag\" panel of \"VIATOR — Resources\"."
      - eval_time: 19m
        alertname: WebEventLoopLagHigh
        exp_alerts: []

  # A lag just at the threshold does not fire; the alert needs it above.
  - interval: 1m
    input_series:
      - series: 'viator_web_event_loop_lag_seconds{job="viator-web"}'
        values: '1x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: WebEventLoopLagHigh
        exp_alerts: []
