worker_processes auto;

# ─────────────────── error log: `crit`, not the default `error` ──────────
# An nginx error line ends with `request: "GET /path?query HTTP/1.1"` (the
# raw request line, query string included) and, when the browser sent one,
# `referrer: "…"` (the previous page's full URL); nginx offers no format for
# it. At the default level `error` such a line is written for every failed
# upstream call, so a typed geocoder text or a token could land in the log.
# What `crit` hides (all at level `error`): an upstream name that does not
# resolve ("web could not be resolved"), an upstream that refuses the
# connection or times out, a body over client_max_body_size (413), an
# auth_request answer other than 2xx/401/403. What it keeps: `emerg` (a
# config that does not load, at start or on reload: bad directive, missing
# certificate) and `alert`/`crit` (worker crashes, out of file descriptors,
# SSL engine failures). The access log below keeps, for every failed
# request, its status (502/504/413), the upstream status (`us`), the
# upstream address it tried (`uaddr`) and the upstream time (`urt`).
# To diagnose an upstream problem, raise it to `error` for the time needed,
# knowing those lines then carry query strings and referrers (admin-guide
# §5.4).
error_log /var/log/nginx/error.log crit;

events { worker_connections 1024; }

http {
    sendfile on;

    # ──────────────── access log without query strings (after #339) ─────────
    # nginx's default `combined` format writes `$request` (the request line,
    # query string included) and `$http_referer` (the previous page's full
    # URL). A query string can carry what a person typed
    # (`/api/geocode?q=…`), a token (`/api/auth/check-token?t=…`) or a
    # filter on a person (`/api/reports/searches?user=…`), and some paths
    # carry a secret themselves: the e-mailed `/confirm/<token>` and
    # `/reset/<token>` links and the share link `/share/coverage/<run id>`.
    # So the one access log below writes:
    #   - the path as the client sent it (`$request_uri` cut at its `?`, so
    #     the session id survives the `rewrite … break` of the per-session
    #     fragments, which changes `$uri`), cut again at an encoded `%3F`,
    #     with the segment after each token prefix replaced by REDACTED — the
    #     prefixes of app/url_redaction.py::TOKEN_PATH_PREFIXES (a test keeps
    #     them equal). Second guard: when the decoded, normalised `$uri` is a
    #     token path but the raw path does not show it (`/confir%6D/…`,
    #     `/a/../reset/…`), the whole path is written `/REDACTED`;
    #   - `?REDACTED` when the request had a query string, never the query;
    #   - no referer; status, bytes, host, request time, upstream status,
    #     address and time, user agent, the request id web echoes (`rid`,
    #     the `request_id` of its log lines) and nginx's own id (`nrid`).
    # Maps, not `set`: the auth_request subrequest shares the request's
    # variables. Every `access_log` must use `viator_redacted`; the generated
    # per-session fragments (sessions_orchestrator) set none and inherit it.
    map $request_uri $viator_req_path {
        "~^([^?]*?)%3[Ff]" "$1%3FREDACTED";
        "~^([^?]*)" "$1";
    }
    map $viator_req_path $viator_req_path_redacted {
        "~^(/confirm/|/reset/|/share/coverage/)[^/]+(.*)$" "$1REDACTED$2";
        default $viator_req_path;
    }
    map $uri $viator_uri_is_token {
        "~^(/confirm/|/reset/|/share/coverage/)" 1;
        default 0;
    }
    map "$viator_uri_is_token:$viator_req_path_redacted" $viator_log_path {
        "~^1:(/confirm/|/reset/|/share/coverage/)" $viator_req_path_redacted;
        "~^1:" "/REDACTED";
        default $viator_req_path_redacted;
    }
    map $args $viator_log_query {
        "" "";
        default "?REDACTED";
    }
    log_format viator_redacted '$remote_addr - [$time_local] '
                               '"$request_method $viator_log_path$viator_log_query $server_protocol" '
                               '$status $body_bytes_sent host=$host rt=$request_time '
                               'us=$upstream_status uaddr=$upstream_addr '
                               'urt="$upstream_response_time" ua="$http_user_agent" '
                               'rid=$upstream_http_x_request_id nrid=$request_id';
    access_log /var/log/nginx/access.log viator_redacted;
    client_max_body_size 4096M;   # OSM PBF / NeTEx ZIPs are large
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    # ─────────────────────── docker DNS resolver (v0.1.15) ───────────────
    # Docker's embedded DNS (always at 127.0.0.11) lets nginx re-resolve
    # service names dynamically. Combined with the variable-based
    # `proxy_pass http://$var` pattern below, this means nginx will pick
    # up a recreated `web` (or `otp-<sid>`) container on its own, without
    # an `nginx -s reload`.
    #
    # Why we needed this: the previous static `upstream { server web:8000; }`
    # block resolved the hostname once at config-load time and cached the
    # IP forever. Each `docker compose up -d web` recreates the container
    # with a new IP → nginx kept proxying to the old (gone) IP → 502 Bad
    # Gateway until somebody manually restarted nginx.
    #
    # `valid=10s` caps the cache TTL so a recreated container is reachable
    # within ~10s. `ipv6=off` because Docker's DNS may return AAAA records
    # the upstream container doesn't bind to.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ─────────────────────────── HTTP → HTTPS redirect ──────────────────────
    # Everything on :80 is redirected to :443. The /.well-known/acme-challenge/
    # path is left available on plain HTTP for Let's Encrypt renewal via the
    # webroot method (see docs in INSTALL.md §11.9).
    server {
        listen 80 default_server;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ─────────────────────────────── HTTPS server ───────────────────────────
    # Cert path matches the issuer name passed to `certbot certonly -d ...`.
    # Bumping or replacing the cert: re-issue with the same `-d <hostname>` and
    # the path stays valid. Issuing with a new hostname requires editing this
    # block (or templating it via env, future cleanup).
    server {
        listen 443 ssl default_server;
        http2 on;
        server_name vmi3259514.contaboserver.net;

        ssl_certificate     /etc/nginx/certs/live/vmi3259514.contaboserver.net/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/live/vmi3259514.contaboserver.net/privkey.pem;

        # Mozilla "intermediate" profile — TLS 1.2 + 1.3 only, no weak ciphers.
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Admin UI + journey UI + REST API + auth flow.
        location / {
            # v0.1.15: variable-based upstream so the docker resolver above
            # is consulted at request time instead of cached at startup.
            # `set` is required — `proxy_pass http://web:8000` (literal)
            # would still cache. The variable forces dynamic resolution.
            set $web_upstream "web:8000";
            proxy_pass http://$web_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # ─── Audit-2026-05 #14 Phase 2 — observability stack reverse-proxy ────
        # Both /grafana/ and /prometheus/ are gated by the same JWT cookie
        # that authenticates the admin UI: nginx hits the internal-only
        # /api/auth/proxy-validate endpoint, which returns 401 when the
        # cookie is missing/invalid (browser auto-redirects to /login) or
        # 200 + identity headers when valid. The headers are then forwarded
        # to Grafana as X-WEBAUTH-USER for Grafana's reverse-proxy SSO.

        location = /api/auth/proxy-validate {
            internal;
            set $web_upstream "web:8000";
            proxy_pass http://$web_upstream;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            # nginx forwards request headers (incl. Cookie) by default; the
            # explicit setter is belt-and-braces in case future config
            # narrows that.
            proxy_set_header Cookie $http_cookie;
        }

        location /grafana/ {
            auth_request /api/auth/proxy-validate;
            auth_request_set $proxy_user $upstream_http_x_forwarded_user;
            auth_request_set $proxy_role $upstream_http_x_forwarded_role;
            error_page 401 = @auth_redirect;

            set $grafana_upstream "grafana:3000";
            proxy_pass http://$grafana_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            # Grafana's reverse-proxy SSO header — must match
            # GF_AUTH_PROXY_HEADER_NAME in docker-compose.yml.
            proxy_set_header X-WEBAUTH-USER $proxy_user;
            proxy_set_header X-Forwarded-User $proxy_user;
            proxy_set_header X-Forwarded-Role $proxy_role;

            # Grafana uses websockets for live dashboards.
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        location /prometheus/ {
            auth_request /api/auth/proxy-validate;
            error_page 401 = @auth_redirect;

            set $prom_upstream "prometheus:9090";
            proxy_pass http://$prom_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Bounce 401s on /grafana/ + /prometheus/ to the admin UI's login
        # page so the operator gets a familiar UX rather than a bare error
        # page. The login flow's redirect-after-login lands them back at
        # the originally-requested URL only when it has no query string:
        # app/api/pages.py::safe_next refuses `?`, so a deep link such as
        # Grafana's `?orgId=1` falls back to the role's default page.
        location @auth_redirect {
            return 302 /login?next=$request_uri;
        }

        # Per-session OTP routing — `location /otp/<sid>/ { ... }` blocks
        # are written by `app/sessions_orchestrator.py` to
        # `./generated/nginx-sessions.conf`, mounted at
        # `/etc/nginx/conf.d/sessions/nginx-sessions.conf`. The glob below
        # matches zero or more files, so nginx still starts cleanly when no
        # session is in state='serving' yet.
        #
        # The generated blocks also use the v0.1.15 variable-based upstream
        # pattern so per-session OTP container restarts don't 502 either.
        include /etc/nginx/conf.d/sessions/*.conf;
    }
}
