# Dependabot — automated dependency PRs.
#
# Three ecosystems covered:
#   1. uv        — runtime + dev Python deps: the sources requirements*.in and the
#                  hashed lock files requirements*.txt compiled from them
#   2. docker    — both Dockerfile base images (python:3.14-slim, eclipse-temurin:25-jre-noble, docker:29-cli)
#   3. github-actions — pinned action versions in .github/workflows/*.yml
#
# Strategy: weekly cadence (Monday 06:00 UTC), grouped by patch-or-minor so
# a normal week produces 3 PRs at most (one per ecosystem), not 30. Major
# updates remain individual PRs because they need human review.
#
# Audit-2026-05 P0 #2.
#
# Python uses the `uv` updater, not `pip`: the locks are made by `uv pip compile
# --universal` (one lock for Linux CI, the linux/amd64 image and a Windows
# workstation; VIATOR-technical-spec.md 15.2.5). The uv updater raises the pin
# in the `.in` file and recompiles each lock that holds the package with the
# options it reads from the lock's header; it can also raise an indirect
# package in the locks alone, for a security fix. The `pip` updater would
# recompile with pip-compile, which resolves for one platform only. Dependabot's
# own uv may be ahead of the one requirements-dev.in pins: if its lock differs,
# CI's "Lock files match their sources" step fails on its pull request, and the
# fix is to run the compile commands of 15.2.5 with the pinned uv on that
# branch. Dependabot reads no file over 500 KB; the largest lock is ~190 KB.
# The pre-commit hooks are local and run the ruff of the lock, so nothing is
# bumped by hand when Dependabot raises ruff (#336 no longer applies).

version: 2
updates:
  # ────────────────────────────── Python ────────────────────────────────
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels: [dependencies, python]
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      python-runtime-patch-minor:
        applies-to: version-updates
        dependency-type: production
        update-types: [patch, minor]
      python-dev-patch-minor:
        applies-to: version-updates
        dependency-type: development
        update-types: [patch, minor]
      python-security:
        applies-to: security-updates
        patterns: ["*"]
    # bcrypt stays below 4.1, as requirements.in pins it. Passwords are hashed
    # through passlib 1.7.4 (app/auth/passwords.py), whose bcrypt extra has no
    # upper bound: bcrypt 4.1.0 raises a TypeError under it, 4.1.3 to 4.3.x
    # work but log a trapped error reading `bcrypt.__about__` in each process,
    # and bcrypt 5 refuses the password longer than 72 bytes that passlib
    # probes it with at its first hash, so every login fails (Dependabot PR
    # #352 failed CI this way). passlib has had no release since 2020.
    # A `versions` ignore also suppresses Dependabot's security updates for
    # bcrypt >= 4.1: until passlib is replaced, a bcrypt advisory is handled
    # by hand. This lifts when a separate pull request replaces passlib by
    # direct calls to bcrypt (existing $2b$ hashes stay valid; passwords over
    # 72 bytes then need handling of our own) and removes this entry.
    # tests/unit/test_hashed_lock_files.py holds it.
    ignore:
      - dependency-name: bcrypt
        versions: [">=4.1"]

  # ────────────────────────────── Docker ────────────────────────────────
  # One block per Dockerfile directory — Dependabot doesn't follow nested
  # Dockerfiles automatically. Bump cadence is monthly because base-image
  # updates are correlated (Debian / Ubuntu point releases land in batches)
  # and per-week PRs would just be churn.
  - package-ecosystem: docker
    directory: /docker/web
    schedule:
      interval: monthly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    labels: [dependencies, docker]
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      web-base-images:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /docker/otp
    schedule:
      interval: monthly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    labels: [dependencies, docker]
    commit-message:
      prefix: "chore(deps)"
      include: scope
    groups:
      otp-base-images:
        patterns: ["*"]

  # ─────────────────────────── GitHub Actions ───────────────────────────
  # Pairs with audit-2026-05 P1 #7 (SHA-pinning): once actions are
  # SHA-pinned, Dependabot keeps them current by opening PRs that bump
  # both the SHA and the version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels: [dependencies, github-actions]
    commit-message:
      prefix: "chore(ci)"
      include: scope
    groups:
      actions-patch-minor:
        update-types: [patch, minor]
