# Audit-2026-05 P1 #7 — third-party actions are pinned to commit SHAs,
# not to floating tags (`@v5`, `@v6`, etc.). The `# vN` trailing comment
# is the human-readable version reference; Dependabot reads it and keeps
# both the SHA and the comment current via security/version-bump PRs.
# Why: a tag can be force-updated by the action publisher (or a compromised
# maintainer account); a SHA can't. For a release pipeline that pushes to
# GHCR, the tag-mutation vector is the primary supply-chain risk.
#
# When updating manually:
#   gh api repos/<owner>/<action>/commits/<tag> --jq '.sha'
# replaces the SHA on the line, then update the trailing comment to match.
#
# Internal `actions/*` references stay tag-pinned to the floating major
# (e.g. `@v5`) only when there is no version-comment after the SHA — never
# in this file.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint + type + test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: viator_ci
          POSTGRES_PASSWORD: viator_ci
          POSTGRES_DB: viator_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://viator_ci:viator_ci@localhost:5432/viator_ci
      INBOX_DIR: /tmp/viator-inbox
      ADMIN_USER: ci
      ADMIN_PASSWORD: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0   # SonarCloud needs full git history for blame

      # The Python of the web image (docker/web/Dockerfile, `FROM python:3.14-slim`);
      # change both together, and the pre-commit job's below (#325). v0.1.44.13
      # passed every check on 3.12 and crash-looped on the image's 3.14 (#324).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # The lock file only (VIATOR-technical-spec.md 15.2.5): every package with
      # its exact version and the sha256 of its files, which pip checks before
      # installing anything; wheels only, so no package's build script runs
      # here. pip and setuptools first, from the image's build lock: pip-audit
      # below audits this environment, pip included, and setup-python's pip
      # can lag behind a fixed CVE (before, `pip install --upgrade pip`,
      # unpinned).
      - name: Install dependencies
        run: |
          python -m pip install --require-hashes --only-binary :all: -r requirements-build.txt
          pip install --require-hashes --only-binary :all: -r requirements-dev.txt

      # Each lock file is compiled again from its source with the uv the dev
      # lock pins (`python -m uv`: the uv package of this Python, never another
      # uv found first on PATH) and the command of 15.2.5, and must come out
      # the same. The versions the lock holds are given as constraints, never
      # the lock itself: uv keeps the hashes of a lock it is given as they are,
      # while it asks the package index for those of a new file. So a package
      # added to a `.in` file and not locked, a pin raised and not locked, a
      # version or a hash edited by hand, a lock missing or empty: each fails
      # here, named, and every lock is checked before the step fails. Comments
      # are left out of the comparison: they are uv's notes, not what pip reads.
      - name: Lock files match their sources
        run: |
          set -euo pipefail
          stale=0
          for name in requirements requirements-dev requirements-build; do
            pins="$RUNNER_TEMP/$name.pins.txt"
            fresh="$RUNNER_TEMP/$name.txt"
            rm -f "$fresh"
            if [ ! -f "$name.txt" ] || ! grep -q -E '^[a-z0-9-]+==' "$name.txt"; then
              echo "::error::$name.txt is missing or holds no package. Compile it from $name.in with the command of VIATOR-technical-spec.md 15.2.5 and commit both files."
              stale=1
              continue
            fi
            grep -E '^[a-z0-9-]+==' "$name.txt" | sed -e 's/ *\\$//' > "$pins"
            if ! python -m uv pip compile --quiet --universal --python-version 3.14 --generate-hashes \
                --emit-build-options "$name.in" -c "$pins" -o "$fresh"; then
              echo "::error::$name.in cannot be compiled to the versions of $name.txt (uv says why above). Never edit a lock file by hand: edit $name.in, run the compile command of VIATOR-technical-spec.md 15.2.5 and commit both files."
              stale=1
              continue
            fi
            if ! diff -u --label "$name.txt (committed)" --label "$name.txt (compiled from $name.in)" \
                <(grep -v -E '^[[:space:]]*(#|$)' "$name.txt") \
                <(grep -v -E '^[[:space:]]*(#|$)' "$fresh"); then
              echo "::error::$name.txt does not match $name.in. Never edit a lock file by hand: edit $name.in, run the compile command of VIATOR-technical-spec.md 15.2.5 and commit both files."
              stale=1
            fi
          done
          if [ "$stale" -ne 0 ]; then
            exit 1
          fi
          echo "Each lock file is what its source compiles to."

      - name: Ruff (lint + format check)
        run: |
          ruff check .
          ruff format --check .

      # Note: black was dropped in audit-#21 closure. `ruff format` is
      # a drop-in replacement (https://docs.astral.sh/ruff/formatter/)
      # and a single formatter eliminates formatter-war flip-flops where
      # ruff-format and black disagreed on Alembic migration files. The
      # ReDoS advisory GHSA-3936-cmfr-pm3m (the original motivation for
      # #21) is moot once black is removed.

      - name: Mypy (strict type check)
        run: mypy app/

      - name: Bandit (security)
        run: bandit -r app/ -ll
        continue-on-error: false

      # Audit-2026-05 P0 #3. pip-audit is in requirements-dev.txt; this
      # step gates the build on Python-layer CVEs (Trivy in docker.yml
      # only catches OS-layer findings inside built images, not the
      # wheel deps we pin in requirements.txt).
      #
      # OSV is the upstream vulnerability service — covers PyPI advisories
      # with no API-key or rate-limit overhead. Failures exit non-zero.
      #
      # ── Accepted CVEs ────────────────────────────────────────────────
      # Mirror the .trivyignore convention: one CVE per line, written
      # justification, re-evaluate when the underlying dep changes.
      #
      # None today. The last one, GHSA-6w46-j5rx-g56g (pytest 8.3.4), went
      # in #336: requirements-dev.txt pins pytest 9.x, which carries the fix
      # (audit-2026-05 #22, done in #56).
      - name: pip-audit (Python CVEs)
        run: |
          pip-audit --strict --vulnerability-service=osv
        continue-on-error: false

      # Audit-2026-05 P0 #4 (coverage floor — the L-effort test-writing
      # campaign is a separate workstream). The floor below is set just
      # under the v0.1.32.1 baseline (13.29% line) to lock in current
      # coverage as a regression gate. Ratchet upward whenever a PR
      # crosses the next round number — never lower it without an
      # explicit audit-tracker note.
      - name: Pytest with coverage (floor 12%)
        run: |
          mkdir -p "$INBOX_DIR"
          pytest --cov-fail-under=12

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  sonarcloud:
    name: SonarCloud
    needs: python
    runs-on: ubuntu-latest
    # Stays dormant until you set repo variable SONARCLOUD_ENABLED=true.
    # Set it once SonarCloud is imported and SONAR_TOKEN secret exists.
    if: |
      vars.SONARCLOUD_ENABLED == 'true'
      && (github.event_name == 'push'
          || github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: coverage-xml

      - uses: SonarSource/sonarcloud-github-action@ffc3010689be73b8e5ae0c57ce35968afd7909e8  # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  pre-commit:
    name: Pre-commit (belt-and-braces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      # Every hook is local and runs a program of the dev lock (pre-commit,
      # pre-commit-hooks, ruff), so this job installs that lock, hashed and
      # wheels only, like the Python job: the same versions as a developer's
      # machine and as CI's lint, and pre-commit installs nothing of its own.
      - name: Install the dev lock (pre-commit, its hooks, ruff)
        run: 'pip install --require-hashes --only-binary :all: -r requirements-dev.txt'
      - run: pre-commit run --all-files --show-diff-on-failure
