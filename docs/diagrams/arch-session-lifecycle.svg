<svg xmlns="http://www.w3.org/2000/svg" width="800" height="566" viewBox="0 0 800 566" font-family="Segoe UI, Calibri, Arial, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5A6673"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5A6673"/></marker><marker id="ahs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9AA5B1"/></marker><marker id="ahsr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9AA5B1"/></marker><marker id="ah_6B2E7A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6B2E7A"/></marker><marker id="ah_6B2E7Ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6B2E7A"/></marker><marker id="ah_A9691A" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A9691A"/></marker><marker id="ah_A9691Ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#A9691A"/></marker><marker id="ah_2E6B3E" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2E6B3E"/></marker><marker id="ah_2E6B3Er" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2E6B3E"/></marker></defs><rect width="800" height="566" fill="#FFFFFF"/><text x="24" y="26" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F3864" text-anchor="start">Session states</text><text x="24" y="44" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#5A6673" text-anchor="start">Only the web container writes states, with one exception: the worker performs populated → graph_built.</text><rect x="180" y="74" width="112" height="40" rx="6" fill="#F4F5F7" stroke="#9AA5B1" stroke-width="1.4" stroke-dasharray="5 3"/><text x="236" y="99" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="12" font-weight="600" fill="#5A6673" text-anchor="middle">configured</text><text x="236" y="128" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#8A96A3" text-anchor="middle" font-style="italic">declared, never assigned</text><rect x="24" y="150" width="112" height="58" rx="6" fill="#E8EDF3" stroke="#1F3864" stroke-width="1.4"/><text x="80" y="184.5" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="13" font-weight="600" fill="#1F3864" text-anchor="middle">created</text><rect x="180" y="150" width="112" height="58" rx="6" fill="#E8EDF3" stroke="#1F3864" stroke-width="1.4"/><text x="236" y="184.5" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="13" font-weight="600" fill="#1F3864" text-anchor="middle">populated</text><rect x="336" y="150" width="124" height="58" rx="6" fill="#E8EDF3" stroke="#1F3864" stroke-width="1.4"/><text x="398" y="184.5" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="13" font-weight="600" fill="#1F3864" text-anchor="middle">graph_built</text><rect x="512" y="150" width="112" height="58" rx="6" fill="#E8EDF3" stroke="#1F3864" stroke-width="2"/><text x="568" y="184.5" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="13" font-weight="600" fill="#1F3864" text-anchor="middle">serving</text><rect x="668" y="150" width="112" height="58" rx="6" fill="#F4F5F7" stroke="#9AA5B1" stroke-width="1.4"/><text x="724" y="184.5" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="13" font-weight="600" fill="#5A6673" text-anchor="middle">archived</text><path d="M 136 179 L 180 179" fill="none" stroke="#5A6673" stroke-width="1.5" marker-end="url(#ah)"/><rect x="117.06687999999998" y="120" width="81.86624000000003" height="27" rx="2.5" fill="#FFFFFF" fill-opacity="0.95"/><text x="158" y="131" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="10.5" fill="#44515E" text-anchor="middle">upload / refresh</text><text x="158" y="143" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="10.5" fill="#44515E" text-anchor="middle">web</text><path d="M 292 179 L 336 179" fill="none" stroke="#A9691A" stroke-width="1.5" marker-end="url(#ah_A9691A)"/><rect x="272.79807999999997" y="120" width="82.40384000000003" height="27" rx="2.5" fill="#FFFFFF" fill-opacity="0.95"/><text x="314" y="131" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="10.5" fill="#44515E" text-anchor="middle">build succeeded</text><text x="314" y="143" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="10.5" fill="#44515E" text-anchor="middle">worker</text><path d="M 460 179 L 512 179" fill="none" stroke="#5A6673" stroke-width="1.5" marker-end="url(#ah)"/><rect x="447.37856" y="120" width="77.24288" height="27" rx="2.5" fill="#FFFFFF" fill-opacity="0.95"/><text x="486" y="131" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="10.5" fill="#44515E" text-anchor="middle">POST /promote</text><text x="486" y="143" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="10.5" fill="#44515E" text-anchor="middle">web</text><path d="M 624 179 L 668 179" fill="none" stroke="#9AA5B1" stroke-width="1.5" marker-end="url(#ahs)"/><rect x="608.9376" y="120" width="74.12480000000001" height="27" rx="2.5" fill="#FFFFFF" fill-opacity="0.95"/><text x="646" y="131" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="10.5" fill="#44515E" text-anchor="middle">POST /archive</text><text x="646" y="143" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="10.5" fill="#44515E" text-anchor="middle">web</text><path d="M 598 150 V 126 H 538 V 150" fill="none" stroke="#9AA5B1" stroke-width="1.5" marker-end="url(#ahs)"/><text x="568" y="120" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="9.5" font-weight="400" fill="#8A96A3" text-anchor="middle" font-style="italic">re-promote allowed</text><path d="M 724 208 V 248 H 80 V 208" fill="none" stroke="#A9691A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah_A9691A)" marker-start="url(#ah_A9691Ar)"/><rect x="239.51551999999998" y="233" width="324.96896000000004" height="15" rx="2.5" fill="#FFFFFF" fill-opacity="0.95"/><text x="402" y="244" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="10.5" fill="#44515E" text-anchor="middle">PATCH /{sid} sets any state to any other — no transition validation</text><rect x="496" y="268" width="284" height="48" rx="8" fill="#F2F8F4" stroke="#2E6B3E" stroke-width="1.25" stroke-dasharray="none"/><text x="638" y="288" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#1E4A2B" text-anchor="middle">A session answers a search only when</text><text x="638" y="303" font-family="Consolas, Courier New, monospace" font-size="10.5" font-weight="400" fill="#1E4A2B" text-anchor="middle">state='serving' AND include_in_fanout</text><text x="24" y="358" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="14" font-weight="700" fill="#1F3864" text-anchor="start">How a compiled graph becomes live</text><rect x="24" y="396" width="144" height="76" rx="6" fill="#E8EDF3" stroke="#1F3864" stroke-width="1.4"/><text x="96" y="424.75" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F3864" text-anchor="middle">web enqueues</text><text x="96" y="438.75" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F3864" text-anchor="middle">a rebuild job</text><text x="96" y="454.75" font-family="Consolas, Courier New, monospace" font-size="10.5" fill="#1F3864" fill-opacity="0.75" text-anchor="middle">status=pending</text><circle cx="36" cy="390" r="9.5" fill="#1F3864"/><text x="36" y="393.6" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="10.924999999999999" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><rect x="176" y="396" width="144" height="76" rx="6" fill="#E8EDF3" stroke="#1F3864" stroke-width="1.4"/><text x="248" y="424.75" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F3864" text-anchor="middle">worker claims it,</text><text x="248" y="438.75" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F3864" text-anchor="middle">runs the build</text><text x="248" y="454.75" font-family="Consolas, Courier New, monospace" font-size="10.5" fill="#1F3864" fill-opacity="0.75" text-anchor="middle">after debounce</text><circle cx="188" cy="390" r="9.5" fill="#1F3864"/><text x="188" y="393.6" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="10.924999999999999" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><path d="M 168 434 L 176 434" fill="none" stroke="#5A6673" stroke-width="1.5" marker-end="url(#ah)"/><rect x="328" y="396" width="144" height="76" rx="6" fill="#E8EDF3" stroke="#1F3864" stroke-width="1.4"/><text x="400" y="424.75" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F3864" text-anchor="middle">graph lands in</text><text x="400" y="438.75" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F3864" text-anchor="middle">&lt;sid&gt;/&lt;timestamp&gt;/</text><text x="400" y="454.75" font-family="Consolas, Courier New, monospace" font-size="10.5" fill="#1F3864" fill-opacity="0.75" text-anchor="middle">worker moves it</text><circle cx="340" cy="390" r="9.5" fill="#1F3864"/><text x="340" y="393.6" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="10.924999999999999" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><path d="M 320 434 L 328 434" fill="none" stroke="#5A6673" stroke-width="1.5" marker-end="url(#ah)"/><rect x="480" y="396" width="144" height="76" rx="6" fill="#E4EEF6" stroke="#215F86" stroke-width="1.4"/><text x="552" y="424.75" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="12" font-weight="600" fill="#154A6B" text-anchor="middle">current  →</text><text x="552" y="438.75" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="12" font-weight="600" fill="#154A6B" text-anchor="middle">&lt;timestamp&gt;</text><text x="552" y="454.75" font-family="Consolas, Courier New, monospace" font-size="10.5" fill="#154A6B" fill-opacity="0.75" text-anchor="middle">relative symlink</text><circle cx="492" cy="390" r="9.5" fill="#1F3864"/><text x="492" y="393.6" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="10.924999999999999" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text><path d="M 472 434 L 480 434" fill="none" stroke="#5A6673" stroke-width="1.5" marker-end="url(#ah)"/><rect x="632" y="396" width="144" height="76" rx="6" fill="#E8EDF3" stroke="#1F3864" stroke-width="1.4"/><text x="704" y="424.75" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F3864" text-anchor="middle">promote swaps</text><text x="704" y="438.75" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F3864" text-anchor="middle">the container</text><text x="704" y="454.75" font-family="Consolas, Courier New, monospace" font-size="10.5" fill="#1F3864" fill-opacity="0.75" text-anchor="middle">≤ 15 s</text><circle cx="644" cy="390" r="9.5" fill="#1F3864"/><text x="644" y="393.6" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="10.924999999999999" font-weight="700" fill="#FFFFFF" text-anchor="middle">5</text><path d="M 624 434 L 632 434" fill="none" stroke="#5A6673" stroke-width="1.5" marker-end="url(#ah)"/><text x="24" y="500" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#5A6673" text-anchor="start">The symlink target must be relative: the graphs volume is mounted six times, at four different container paths,</text><text x="24" y="515" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#5A6673" text-anchor="start">so an absolute target would resolve only in the namespace that wrote it.</text><text x="24" y="540" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8A96A3" text-anchor="start" font-style="italic">deleted is also in the enum and never assigned — DELETE hard-deletes the row instead.</text></svg>
