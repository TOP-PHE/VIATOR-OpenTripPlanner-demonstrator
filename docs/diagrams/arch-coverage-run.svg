height="44" rx="6" fill="#E8EDF3" stroke="#1F3864" stroke-width="1.4"/><text x="400" y="41.25" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1F3864" text-anchor="middle">POST /network-coverage/runs</text><rect x="150" y="74" width="500" height="54" rx="6" fill="#E8EDF3" stroke="#1F3864" stroke-width="1.4"/><text x="400" y="99.25" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="13" font-weight="600" fill="#1F3864" text-anchor="middle">runner.create_run()</text><text x="400" y="116.25" font-family="Consolas, Courier New, monospace" font-size="10.5" fill="#1F3864" fill-opacity="0.75" text-anchor="middle">validate · load hubs · enumerate pairs · INSERT pending</text><text x="776" y="148" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#A9691A" text-anchor="end" font-style="italic">HTTP 200 returns here — the run is still “pending” and nothing has been routed yet</text><rect x="230" y="158" width="340" height="48" rx="6" fill="#FFFFFF" stroke="#1F3864" stroke-width="1.4"/><text x="400" y="180" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1F3864" text-anchor="middle">bg.add_task(execute_run)</text><text x="400" y="196.5" font-family="Consolas, Courier New, monospace" font-size="10.5" fill="#1F3864" fill-opacity="0.75" text-anchor="middle">in the web container</text><rect x="20" y="232" width="760" height="88" rx="8" fill="none" stroke="#9AA5B1" stroke-width="1.25" stroke-dasharray="6 4"/><rect x="32" y="224" width="166.0320000000001" height="16" rx="3" fill="#FFFFFF"/><text x="37" y="236" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#5A6673">Phase 1 — snapshot and start</text><rect x="40" y="252" width="230" height="52" rx="6" fill="#E8EDF3" stroke="#1F3864" stroke-width="1.4"/><text x="155" y="275.75" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F3864" text-anchor="middle">status → running</text><text x="155" y="291.75" font-family="Consolas, Courier New, monospace" font-size="10.5" fill="#1F3864" fill-opacity="0.75" text-anchor="middle">config frozen for the run</text><rect x="290" y="252" width="230" height="52" rx="6" fill="#E8EDF3" stroke="#1F3864" stroke-width="1.4"/><text x="405" y="275.75" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F3864" text-anchor="middle">re-read active hubs</text><text x="405" y="291.75" font-family="Consolas, Courier New, monospace" font-size="10.5" fill="#1F3864" fill-opacity="0.75" text-anchor="middle">country filter applied</text><rect x="540" y="252" width="220" height="52" rx="6" fill="#E8EDF3" stroke="#1F3864" stroke-width="1.4"/><text x="650" y="275.75" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F3864" text-anchor="middle">enumerate pairs</text><text x="650" y="291.75" font-family="Consolas, Courier New, monospace" font-size="10.5" fill="#1F3864" fill-opacity="0.75" text-anchor="middle">both → N·(N−1)</text><path d="M 270 278 L 290 278" fill="none" stroke="#5A6673" stroke-width="1.5" marker-end="url(#ah)"/><path d="M 520 278 L 540 278" fill="none" stroke="#5A6673" stroke-width="1.5" marker-end="url(#ah)"/><rect x="20" y="344" width="760" height="152" rx="8" fill="none" stroke="#9AA5B1" stroke-width="1.25" stroke-dasharray="6 4"/><rect x="32" y="336" width="150.84096000000008" height="16" rx="3" fill="#FFFFFF"/><text x="37" y="348" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#5A6673">Phase 2 — route every pair</text><rect x="36" y="384" width="142" height="76" rx="6" fill="#E8EDF3" stroke="#1F3864" stroke-width="1.4"/><text x="107" y="412.75" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F3864" text-anchor="middle">gather</text><text x="107" y="426.75" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F3864" text-anchor="middle">over pairs</text><text x="107" y="442.75" font-family="Consolas, Courier New, monospace" font-size="10.5" fill="#1F3864" fill-opacity="0.75" text-anchor="middle">semaphore</text><rect x="190" y="384" width="132" height="76" rx="6" fill="#F4F5F7" stroke="#9AA5B1" stroke-width="1.4"/><text x="256" y="412.75" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="12" font-weight="600" fill="#5A6673" text-anchor="middle">cancel</text><text x="256" y="426.75" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="12" font-weight="600" fill="#5A6673" text-anchor="middle">check</text><text x="256" y="442.75" font-family="Consolas, Courier New, monospace" font-size="10.5" fill="#5A6673" fill-opacity="0.75" text-anchor="middle">memory + DB</text><rect x="334" y="384" width="142" height="76" rx="6" fill="#E8EDF3" stroke="#1F3864" stroke-width="1.4"/><text x="405" y="412.75" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F3864" text-anchor="middle">K-slot</text><text x="405" y="426.75" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F3864" text-anchor="middle">fan-out</text><text x="405" y="442.75" font-family="Consolas, Courier New, monospace" font-size="10.5" fill="#1F3864" fill-opacity="0.75" text-anchor="middle">K = 6</text><rect x="488" y="384" width="132" height="76" rx="6" fill="#E4EEF6" stroke="#215F86" stroke-width="1.4"/><text x="554" y="412.75" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="12" font-weight="600" fill="#154A6B" text-anchor="middle">otp /</text><text x="554" y="426.75" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="12" font-weight="600" fill="#154A6B" text-anchor="middle">motis</text><text x="554" y="442.75" font-family="Consolas, Courier New, monospace" font-size="10.5" fill="#154A6B" fill-opacity="0.75" text-anchor="middle">per slot</text><rect x="632" y="384" width="136" height="76" rx="6" fill="#E7F1EA" stroke="#2E6B3E" stroke-width="1.4"/><text x="700" y="412.75" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="12" font-weight="600" fill="#1E4A2B" text-anchor="middle">persist</text><text x="700" y="426.75" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="12" font-weight="600" fill="#1E4A2B" text-anchor="middle">the cell</text><text x="700" y="442.75" font-family="Consolas, Courier New, monospace" font-size="10.5" fill="#1E4A2B" fill-opacity="0.75" text-anchor="middle">own txn</text><path d="M 178 422 L 190 422" fill="none" stroke="#5A6673" stroke-width="1.5" marker-end="url(#ah)"/><path d="M 322 422 L 334 422" fill="none" stroke="#5A6673" stroke-width="1.5" marker-end="url(#ah)"/><path d="M 476 422 L 488 422" fill="none" stroke="#5A6673" stroke-width="1.5" marker-end="url(#ah)"/><path d="M 620 422 L 632 422" fill="none" stroke="#5A6673" stroke-width="1.5" marker-end="url(#ah)"/><text x="40" y="480" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#5A6673" text-anchor="start">One short-lived DB transaction per pair. A cancel is honoured between pairs, never mid-pair.</text><rect x="20" y="520" width="760" height="164" rx="8" fill="none" stroke="#A9691A" stroke-width="1.25" stroke-dasharray="6 4"/><rect x="32" y="512" width="160.73280000000008" height="16" rx="3" fill="#FFFFFF"/><text x="37" y="524" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#A9691A">Phase 3 — verify and finalise</text><text x="756" y="548" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#A9691A" text-anchor="end" font-style="italic">skipped entirely if the run was cancelled</text><rect x="60" y="556" width="200" height="70" rx="6" fill="#E8EDF3" stroke="#1F3864" stroke-width="1.4"/><text x="160" y="588.75" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F3864" text-anchor="middle">reference sweep</text><text x="160" y="604.75" font-family="Consolas, Courier New, monospace" font-size="10.5" fill="#1F3864" fill-opacity="0.75" text-anchor="middle">over every cell</text><rect x="300" y="556" width="200" height="70" rx="6" fill="#FBEFE0" stroke="#A9691A" stroke-width="1.4"/><text x="400" y="588.75" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="12" font-weight="600" fill="#7A4A10" text-anchor="middle">ÖBB HAFAS</text><text x="400" y="604.75" font-family="Consolas, Courier New, monospace" font-size="10.5" fill="#7A4A10" fill-opacity="0.75" text-anchor="middle">≈ 1 request / second</text><rect x="540" y="556" width="200" height="70" rx="6" fill="#E8EDF3" stroke="#1F3864" stroke-width="1.4"/><text x="640" y="588.75" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F3864" text-anchor="middle">compute_alignment</text><text x="640" y="604.75" font-family="Consolas, Courier New, monospace" font-size="10.5" fill="#1F3864" fill-opacity="0.75" text-anchor="middle">score + tier per cell</text><path d="M 260 591 L 300 591" fill="none" stroke="#5A6673" stroke-width="1.5" marker-end="url(#ah)"/><path d="M 500 591 L 540 591" fill="none" stroke="#5A6673" stroke-width="1.5" marker-end="url(#ah)"/><text x="40" y="652" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#5A6673" text-anchor="start">Eight tier strings are written: agree · mostly_agree · partial · disagree · no_overlap ·</text><text x="40" y="668" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#5A6673" text-anchor="start">one_sided_oebb · one_sided_viator · no_service.   A ninth, no_data, exists only in the matrix UI.</text><rect x="280" y="706" width="240" height="46" rx="6" fill="#E7F1EA" stroke="#2E6B3E" stroke-width="1.4"/><text x="400" y="734.25" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#1E4A2B" text-anchor="middle">status = completed</text><path d="M 400 58 L 400 74" fill="none" stroke="#5A6673" stroke-width="1.5" marker-end="url(#ah)"/><path d="M 170 128 L 240 158" fill="none" stroke="#5A6673" stroke-width="1.5" marker-end="url(#ah)"/><path d="M 400 206 V 224 H 235 V 252" fill="none" stroke="#5A6673" stroke-width="1.5" marker-end="url(#ah)"/><path d="M 650 304 V 330 H 107 V 384" fill="none" stroke="#5A6673" stroke-width="1.5" marker-end="url(#ah)"/><path d="M 700 460 V 508 H 240 V 556" fill="none" stroke="#5A6673" stroke-width="1.5" marker-end="url(#ah)"/><path d="M 640 626 V 694 H 400 V 706" fill="none" stroke="#5A6673" stroke-width="1.5" marker-end="url(#ah)"/><circle cx="52" cy="396" r="9.5" fill="#1F3864"/><text x="52" y="399.6" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="10.924999999999999" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text><circle cx="346" cy="396" r="9.5" fill="#1F3864"/><text x="346" y="399.6" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="10.924999999999999" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text><circle cx="72" cy="568" r="9.5" fill="#1F3864"/><text x="72" y="571.6" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="10.924999999999999" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text><text x="24" y="780" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#5A6673" text-anchor="start">The whole run executes inside the web container as a FastAPI background task. Killing web kills the run in flight;</text><text x="24" y="796" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#5A6673" text-anchor="start">a startup hook marks any run left “running” as failed.</text><text x="24" y="820" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8A96A3" text-anchor="start" font-style="italic">Phase 1 re-reads the hub list, so a hub edited between creating and starting a run changes what actually gets tested.</text></svg>
