" y="175.25" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="13" font-weight="600" fill="#1F3864" text-anchor="middle">journey/</text><text x="356" y="192.25" font-family="Consolas, Courier New, monospace" font-size="10.5" fill="#1F3864" fill-opacity="0.75" text-anchor="middle">engines + oracles</text><rect x="438" y="148" width="170" height="58" rx="6" fill="#E8EDF3" stroke="#1F3864" stroke-width="1.4"/><text x="523" y="174.75" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F3864" text-anchor="middle">network_coverage/</text><text x="523" y="190.75" font-family="Consolas, Courier New, monospace" font-size="10.5" fill="#1F3864" fill-opacity="0.75" text-anchor="middle">the matrix</text><rect x="620" y="148" width="150" height="58" rx="6" fill="#E8EDF3" stroke="#1F3864" stroke-width="1.4"/><text x="695" y="174.75" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F3864" text-anchor="middle">sessions_</text><text x="695" y="190.75" font-family="Consolas, Courier New, monospace" font-size="10.5" fill="#1F3864" fill-opacity="0.75" text-anchor="middle">orchestrator</text><rect x="104" y="248" width="130" height="54" rx="6" fill="#E8EDF3" stroke="#1F3864" stroke-width="1.4"/><text x="169" y="280" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F3864" text-anchor="middle">templating</text><rect x="246" y="248" width="120" height="54" rx="6" fill="#E8EDF3" stroke="#1F3864" stroke-width="1.4"/><text x="306" y="280" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F3864" text-anchor="middle">geo_gtfs</text><rect x="378" y="248" width="170" height="54" rx="6" fill="#E8EDF3" stroke="#1F3864" stroke-width="1.4"/><text x="463" y="279.75" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1F3864" text-anchor="middle">graph_build_helpers</text><rect x="560" y="248" width="210" height="54" rx="6" fill="#E8EDF3" stroke="#1F3864" stroke-width="1.4"/><text x="665" y="272.75" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="12" font-weight="600" fill="#1F3864" text-anchor="middle">nap_ingest</text><text x="665" y="288.75" font-family="Consolas, Courier New, monospace" font-size="10.5" fill="#1F3864" fill-opacity="0.75" text-anchor="middle">detect · ingest · sweep</text><rect x="104" y="336" width="160" height="54" rx="6" fill="#F4F5F7" stroke="#9AA5B1" stroke-width="1.4"/><text x="184" y="368" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="12" font-weight="600" fill="#5A6673" text-anchor="middle">security + auth</text><rect x="276" y="336" width="130" height="54" rx="6" fill="#F4F5F7" stroke="#9AA5B1" stroke-width="1.4"/><text x="341" y="368" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="12" font-weight="600" fill="#5A6673" text-anchor="middle">config</text><rect x="418" y="336" width="150" height="54" rx="6" fill="#F4F5F7" stroke="#9AA5B1" stroke-width="1.4"/><text x="493" y="360.75" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="12" font-weight="600" fill="#5A6673" text-anchor="middle">observability</text><text x="493" y="376.75" font-family="Consolas, Courier New, monospace" font-size="10.5" fill="#5A6673" fill-opacity="0.75" text-anchor="middle">main.py only</text><rect x="580" y="336" width="190" height="54" rx="6" fill="#F4F5F7" stroke="#9AA5B1" stroke-width="1.4"/><text x="675" y="360.75" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="12" font-weight="600" fill="#5A6673" text-anchor="middle">ops_guards</text><text x="675" y="376.75" font-family="Consolas, Courier New, monospace" font-size="10.5" fill="#5A6673" fill-opacity="0.75" text-anchor="middle">audit · limits · retention</text><rect x="180" y="424" width="190" height="54" rx="6" fill="#E7F1EA" stroke="#2E6B3E" stroke-width="1.4"/><text x="275" y="449.25" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="13" font-weight="600" fill="#1E4A2B" text-anchor="middle">models/</text><text x="275" y="466.25" font-family="Consolas, Courier New, monospace" font-size="10.5" fill="#1E4A2B" fill-opacity="0.75" text-anchor="middle">in 14 · out 0</text><rect x="382" y="424" width="110" height="54" rx="6" fill="#E7F1EA" stroke="#2E6B3E" stroke-width="1.4"/><text x="437" y="456" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="12" font-weight="600" fill="#1E4A2B" text-anchor="middle">db</text><rect x="504" y="424" width="140" height="54" rx="6" fill="#E7F1EA" stroke="#2E6B3E" stroke-width="1.4"/><text x="574" y="448.75" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="12" font-weight="600" fill="#1E4A2B" text-anchor="middle">settings</text><text x="574" y="464.75" font-family="Consolas, Courier New, monospace" font-size="10.5" fill="#1E4A2B" fill-opacity="0.75" text-anchor="middle">in 10 · out 0</text><path d="M 189 114 V 132 H 189 V 148" fill="none" stroke="#5A6673" stroke-width="1.5" marker-end="url(#ah)"/><path d="M 249 148 V 132 H 523 V 148" fill="none" stroke="#5A6673" stroke-width="1.5" marker-end="url(#ah)"/><path d="M 274 177 L 286 177" fill="none" stroke="#5A6673" stroke-width="1.5" marker-end="url(#ah)"/><path d="M 349 114 V 142 H 695 V 148" fill="none" stroke="#9AA5B1" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ahs)"/><path d="M 438 168 L 426 168" fill="none" stroke="#5A6673" stroke-width="1.5" marker-end="url(#ah)"/><path d="M 426 186 L 438 186" fill="none" stroke="#A9691A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#ah_A9691A)"/><text x="330" y="228" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="10" font-weight="400" fill="#A9691A" text-anchor="middle">the only back-edge: hafas_client → external_verify</text><path d="M 614 114 V 226 H 503 V 248" fill="none" stroke="#5A6673" stroke-width="1.5" marker-end="url(#ah)"/><path d="M 770 85 H 786 V 275 H 770" fill="none" stroke="#5A6673" stroke-width="1.5" marker-end="url(#ah)"/><text x="24" y="508" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#5A6673" text-anchor="start">Dependencies point downward only. models/ and settings.py import nothing at all — they are the sink of the whole graph.</text><text x="24" y="526" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#5A6673" text-anchor="start">The worker never imports api, journey or network_coverage. Coverage runs execute in the web container, not the worker.</text><text x="24" y="544" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#5A6673" text-anchor="start">app/templates and app/static hold no Python; they are assets reached through templating. About a third of api’s imports are function-scope.</text><text x="24" y="570" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#8A96A3" text-anchor="start" font-style="italic">Second exception, not shown: osm_geo ⇄ gtfs_cross_border_filter, a real cycle deliberately broken by a lazy import.</text></svg>
