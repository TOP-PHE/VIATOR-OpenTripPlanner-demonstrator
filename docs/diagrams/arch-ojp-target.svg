eight="50" rx="6" fill="#EFEFF2" stroke="#5A6673" stroke-width="1.4"/><text x="200" y="37" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#33404D" text-anchor="middle">OJP clients</text><text x="200" y="53.5" font-family="Consolas, Courier New, monospace" font-size="10.5" fill="#33404D" fill-opacity="0.75" text-anchor="middle">LinkingAlps · EU-Spirit</text><rect x="440" y="14" width="280" height="50" rx="6" fill="#EFEFF2" stroke="#5A6673" stroke-width="1.4"/><text x="580" y="37" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#33404D" text-anchor="middle">comparison clients</text><text x="580" y="53.5" font-family="Consolas, Courier New, monospace" font-size="10.5" fill="#33404D" fill-opacity="0.75" text-anchor="middle">analysts · dashboards</text><rect x="20" y="92" width="760" height="118" rx="8" fill="none" stroke="#6B2E7A" stroke-width="1.25" stroke-dasharray="6 4"/><rect x="32" y="84" width="196.88512000000011" height="16" rx="3" fill="#FFFFFF"/><text x="37" y="96" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#6B2E7A">proposed — the VIATOR API surface</text><rect x="40" y="120" width="230" height="74" rx="6" fill="#F5E9F7" stroke="#6B2E7A" stroke-width="1.4"/><text x="155" y="155" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#54215F" text-anchor="middle">POST /ojp</text><text x="155" y="171.5" font-family="Consolas, Courier New, monospace" font-size="10.5" fill="#54215F" fill-opacity="0.75" text-anchor="middle">VIATOR trips only</text><rect x="219.11936" y="113" width="44.88064" height="15" rx="7.5" fill="#6B2E7A"/><text x="241.55968000000001" y="124" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Stage 2</text><rect x="288" y="120" width="210" height="74" rx="6" fill="#F5E9F7" stroke="#6B2E7A" stroke-width="1.4"/><text x="393" y="154.75" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="12" font-weight="600" fill="#54215F" text-anchor="middle">POST /api/v1/plan</text><text x="393" y="170.75" font-family="Consolas, Courier New, monospace" font-size="10.5" fill="#54215F" fill-opacity="0.75" text-anchor="middle">versioned REST/JSON</text><rect x="447.11936000000003" y="113" width="44.88064" height="15" rx="7.5" fill="#6B2E7A"/><text x="469.55968" y="124" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Stage 1</text><rect x="516" y="120" width="244" height="74" rx="6" fill="#F5E9F7" stroke="#6B2E7A" stroke-width="1.4"/><text x="638" y="154.75" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="12" font-weight="600" fill="#54215F" text-anchor="middle">POST /api/v1/compare</text><text x="638" y="170.75" font-family="Consolas, Courier New, monospace" font-size="10.5" fill="#54215F" fill-opacity="0.75" text-anchor="middle">VIATOR + oracles + scoring</text><rect x="709.11936" y="113" width="44.88064" height="15" rx="7.5" fill="#6B2E7A"/><text x="731.55968" y="124" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">Stage 2</text><rect x="170" y="250" width="460" height="60" rx="6" fill="#E8EDF3" stroke="#1F3864" stroke-width="1.4"/><text x="400" y="278.25" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="13" font-weight="600" fill="#1F3864" text-anchor="middle">the existing fanout</text><text x="400" y="295.25" font-family="Consolas, Courier New, monospace" font-size="10.5" fill="#1F3864" fill-opacity="0.75" text-anchor="middle">/api/journey/fanout — reused unchanged</text><rect x="80" y="352" width="280" height="58" rx="6" fill="#E8EDF3" stroke="#1F3864" stroke-width="1.4"/><text x="220" y="379.25" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="13" font-weight="600" fill="#1F3864" text-anchor="middle">planner_dispatch</text><text x="220" y="396.25" font-family="Consolas, Courier New, monospace" font-size="10.5" fill="#1F3864" fill-opacity="0.75" text-anchor="middle">the engine seam</text><rect x="440" y="352" width="280" height="58" rx="6" fill="#E8EDF3" stroke="#1F3864" stroke-width="1.4"/><text x="580" y="379.25" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="13" font-weight="600" fill="#1F3864" text-anchor="middle">oracle registry</text><text x="580" y="396.25" font-family="Consolas, Courier New, monospace" font-size="10.5" fill="#1F3864" fill-opacity="0.75" text-anchor="middle">selectable per run and country</text><rect x="80" y="448" width="280" height="62" rx="6" fill="#E4EEF6" stroke="#215F86" stroke-width="1.4"/><text x="220" y="477.25" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="13" font-weight="600" fill="#154A6B" text-anchor="middle">MOTIS sessions</text><text x="220" y="494.25" font-family="Consolas, Courier New, monospace" font-size="10.5" fill="#154A6B" fill-opacity="0.75" text-anchor="middle">fed from National Access Points</text><rect x="264.17599999999993" y="441" width="89.82400000000004" height="15" rx="7.5" fill="#215F86"/><text x="309.08799999999997" y="452" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">also serves /ojp20</text><rect x="440" y="442" width="280" height="74" rx="6" fill="#FBEFE0" stroke="#A9691A" stroke-width="1.4"/><text x="580" y="470.25" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#7A4A10" text-anchor="middle">ÖBB HAFAS · Swiss OJP</text><text x="580" y="483.75" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#7A4A10" text-anchor="middle">Digitransit (FI + EE)</text><text x="580" y="497.25" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#7A4A10" text-anchor="middle">NAPCORE demonstrator</text><path d="M 200 64 L 155 120" fill="none" stroke="#6B2E7A" stroke-width="1.5" marker-end="url(#ah_6B2E7A)"/><path d="M 580 64 L 638 120" fill="none" stroke="#6B2E7A" stroke-width="1.5" marker-end="url(#ah_6B2E7A)"/><path d="M 155 194 V 228 H 250 V 250" fill="none" stroke="#6B2E7A" stroke-width="1.5" marker-end="url(#ah_6B2E7A)"/><path d="M 393 194 V 234 H 400 V 250" fill="none" stroke="#6B2E7A" stroke-width="1.5" marker-end="url(#ah_6B2E7A)"/><path d="M 638 194 V 228 H 550 V 250" fill="none" stroke="#6B2E7A" stroke-width="1.5" marker-end="url(#ah_6B2E7A)"/><path d="M 240 310 V 332 H 220 V 352" fill="none" stroke="#5A6673" stroke-width="1.5" marker-end="url(#ah)"/><path d="M 560 310 V 332 H 580 V 352" fill="none" stroke="#5A6673" stroke-width="1.5" marker-end="url(#ah)"/><path d="M 220 410 L 220 448" fill="none" stroke="#5A6673" stroke-width="1.5" marker-end="url(#ah)"/><path d="M 580 410 L 580 442" fill="none" stroke="#A9691A" stroke-width="1.5" marker-end="url(#ah_A9691A)"/><text x="24" y="240" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#6B2E7A" text-anchor="start" font-style="italic">the API sits above the engines</text><text x="24" y="552" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#5A6673" text-anchor="start">ojp_client.py is already 723 lines of OJP 2.0 XML proven against the live Swiss endpoint. Stage 2 inverts it:</text><text x="24" y="568" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#5A6673" text-anchor="start">parse an inbound OJPTripRequest, run the existing fanout, emit TripResults. Marshalling, not protocol research.</text><text x="24" y="584" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#5A6673" text-anchor="start">MOTIS 2.9+ serves its own /ojp20, but that is one session’s graph — not the fanout, and not schema-valid.</text><text x="24" y="606" font-family="Segoe UI, Calibri, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#A9691A" text-anchor="start" font-style="italic">Oracle trips never enter the /ojp response — a standard OJP consumer would silently attribute them to VIATOR.</text></svg>
