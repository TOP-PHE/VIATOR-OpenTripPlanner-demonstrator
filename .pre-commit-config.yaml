# Run on every commit. Install once with `pre-commit install`.
# CI also runs `pre-commit run --all-files` as a belt-and-braces check.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # black removed in audit-2026-05 #21 closure. `ruff format` (the
  # ruff-pre-commit hook above) replaces it — single formatter, no
  # flip-flops between two tools with subtly different rules
  # (specifically the multi-line-string `op.execute("""...""")` pattern
  # in Alembic migrations where black 26 + ruff-format 0.7 disagree).

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.0.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic==2.10.3
          - pydantic-settings==2.6.1
          - sqlalchemy==2.0.49
          - fastapi==0.115.6
          - types-defusedxml==0.7.0.20260504  # stubs for app/journey/ojp_client.py
        args: ["--config-file=pyproject.toml"]
        # mypy is slow; skip on commit, run on push or in CI
        stages: [pre-push]

  # Dockerfile linting deliberately does NOT live here.
  #
  # It runs as the `hadolint` job in .github/workflows/docker.yml, via the
  # SHA-pinned hadolint/hadolint-action. That is the single source of truth.
  #
  # Why not a pre-commit hook as well:
  #   - The upstream hadolint-docker hook's entry carries no image tag, so it
  #     resolves :latest. `rev:` pins the hook definition, never the image. CI
  #     therefore tracked whatever :latest happened to be, and on 2026-09-04 a
  #     newer image began failing every open PR on unchanged Dockerfiles.
  #   - `pre-commit run --all-files` lints Dockerfiles on every PR regardless of
  #     what changed, which is exactly the docs-only-PR stall that docker.yml's
  #     `docker-gate` design (audit-2026-05 #26) exists to prevent.
  #   - The action is covered by Dependabot's github-actions ecosystem, so it
  #     stays current *and* every version change arrives as a reviewable PR that
  #     CI proves before merge. An unpinned image gives currency without either.
  #   - Dropping it also means pre-commit no longer needs a Docker daemon locally.
