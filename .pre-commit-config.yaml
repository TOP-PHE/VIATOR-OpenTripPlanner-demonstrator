# Run on every commit. Install once with `pre-commit install`.
# CI also runs `pre-commit run --all-files` as a belt-and-braces check.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # black removed in audit-2026-05 #21 closure. `ruff format` (the
  # ruff-pre-commit hook above) replaces it — single formatter, no
  # flip-flops between two tools with subtly different rules
  # (specifically the multi-line-string `op.execute("""...""")` pattern
  # in Alembic migrations where black 26 + ruff-format 0.7 disagree).

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.0.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic==2.10.3
          - pydantic-settings==2.6.1
          - sqlalchemy==2.0.49
          - fastapi==0.115.6
          - types-defusedxml==0.7.0.20260504  # stubs for app/journey/ojp_client.py
        args: ["--config-file=pyproject.toml"]
        # mypy is slow; skip on commit, run on push or in CI
        stages: [pre-push]

  # hadolint, declared locally so the IMAGE can be pinned.
  #
  # The upstream hadolint-docker hook's entry is `ghcr.io/hadolint/hadolint hadolint`
  # with no tag, so it resolves :latest. `rev:` pins the hook *definition*, never the
  # image — and there is no v2.13.1-beta image tag at all, only -beta3/-beta4 and the
  # released v2.13.1. So CI silently tracked whatever :latest happened to be.
  #
  # That bit on 2026-09-04: main was last green on 2026-07-08, :latest had moved on
  # (hadolint is at v2.15.1 now), and the newer image started emitting DL3066/DL3025
  # against Dockerfiles nobody had touched — blocking every open PR, including a
  # docs-only one. Declaring the hook locally is the only way to pin the image.
  #
  # Ignored rules, all deliberate rather than unfixed:
  #   DL3008/DL3013  unpinned apt/pip versions — accepted for this project
  #   DL3066         `USER appuser:appuser` is intentional. Both images `chown -R
  #                  appuser:appuser` first, and a numeric UID would break the volume
  #                  ownership the inbox and graphs mounts depend on
  #   DL3025         the HEALTHCHECK needs shell form for its `|| exit 1` fallback;
  #                  JSON notation would silently drop it
  - repo: local
    hooks:
      - id: hadolint-docker
        name: Lint Dockerfiles
        language: docker_image
        types: ["dockerfile"]
        entry: ghcr.io/hadolint/hadolint:v2.13.1 hadolint
        args:
          ["--ignore", "DL3008", "--ignore", "DL3013",
           "--ignore", "DL3066", "--ignore", "DL3025"]
