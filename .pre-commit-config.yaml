# Run on every commit. Install once with `pre-commit install`.
# CI also runs `pre-commit run --all-files` as a belt-and-braces check.
#
# Every hook is local (`repo: local`, `language: system`): it runs a program
# installed from the hashed lock file requirements-dev.txt (the hygiene checks
# of the pre-commit-hooks package, ruff, mypy), so pre-commit fetches no hook
# repository and pip-installs nothing of its own. Before, it cloned
# pre-commit-hooks and ruff-pre-commit by tag (a tag can be moved) and
# installed them with unpinned, unhashed dependencies. Each hook below is
# written as its project defines it (pre-commit-hooks v6.0.0, ruff-pre-commit
# at the ruff of the lock): the same program, the same kinds of file, the same
# stages. `language: system` finds the programs on PATH, so run pre-commit from
# the activated environment that holds requirements-dev.txt, as CI does.
# tests/unit/test_dev_tool_pins_stay_in_step.py holds these rules.

repos:
  - repo: local
    hooks:
      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: trailing-whitespace-fixer
        language: system
        types: [text]
        stages: [pre-commit, pre-push, manual]
      - id: end-of-file-fixer
        name: fix end of files
        entry: end-of-file-fixer
        language: system
        types: [text]
        stages: [pre-commit, pre-push, manual]
      - id: check-yaml
        name: check yaml
        entry: check-yaml
        language: system
        types: [yaml]
      - id: check-toml
        name: check toml
        entry: check-toml
        language: system
        types: [toml]
      - id: check-added-large-files
        name: check for added large files
        entry: check-added-large-files
        language: system
        args: ["--maxkb=1024"]
        stages: [pre-commit, pre-push, manual]
      - id: check-merge-conflict
        name: check for merge conflicts
        entry: check-merge-conflict
        language: system
        types: [text]
      - id: detect-private-key
        name: detect private key
        entry: detect-private-key
        language: system
        types: [text]

      # The ruff of requirements-dev.txt, the one CI's Python job lints and
      # formats with: Dependabot raising it in the lock raises it here too.
      - id: ruff-check   # the hook repo calls the old id "ruff" a legacy alias
        name: ruff check
        entry: ruff check --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        args: ["--fix"]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: ruff format --force-exclude
        language: system
        types_or: [python, pyi, jupyter, markdown]
        require_serial: true

  # black removed in audit-2026-05 #21 closure. `ruff format` (the
  # ruff-format hook above) replaces it — single formatter, no
  # flip-flops between two tools with subtly different rules
  # (specifically the multi-line-string `op.execute("""...""")` pattern
  # in Alembic migrations where black 26 + ruff-format 0.7 disagree).

  # mypy runs from the developer's own environment, not from an isolated
  # pre-commit one (#327). It is the exact command CI's Python job runs,
  # `mypy app/`, with the mypy, stubs and app packages that
  # requirements-dev.txt pins, so there is no second list of versions to keep
  # in step by hand (the old mirrors-mypy hook's `additional_dependencies` had
  # drifted until it could not install on Python 3.14). It needs the dev lock
  # (`pip install --require-hashes --only-binary :all: -r requirements-dev.txt`)
  # in the environment you push from.
  # Pre-push only: mypy is slow for every commit. CI's pre-commit job runs the
  # commit stage only, so this hook never runs there; CI runs `mypy app/`
  # itself.
  - repo: local
    hooks:
      - id: mypy
        name: mypy app/ (as CI runs it)
        entry: mypy app/
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [pre-push]

  # Dockerfile linting deliberately does NOT live here.
  #
  # It runs as the `hadolint` job in .github/workflows/docker.yml, via the
  # SHA-pinned hadolint/hadolint-action. That is the single source of truth.
  #
  # Why not a pre-commit hook as well:
  #   - The upstream hadolint-docker hook's entry carries no image tag, so it
  #     resolves :latest. `rev:` pins the hook definition, never the image. CI
  #     therefore tracked whatever :latest happened to be, and on 2026-09-04 a
  #     newer image began failing every open PR on unchanged Dockerfiles.
  #   - `pre-commit run --all-files` lints Dockerfiles on every PR regardless of
  #     what changed, which is exactly the docs-only-PR stall that docker.yml's
  #     `docker-gate` design (audit-2026-05 #26) exists to prevent.
  #   - The action is covered by Dependabot's github-actions ecosystem, so it
  #     stays current *and* every version change arrives as a reviewable PR that
  #     CI proves before merge. An unpinned image gives currency without either.
  #   - Dropping it also means pre-commit no longer needs a Docker daemon locally.
